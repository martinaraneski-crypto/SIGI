<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGI - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card-login {
            border: none;
            border-radius: 12px;
            background-color: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100">
    <div class="card card-login p-4" style="width: 450px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark fs-3">Sistema de Gestión de Insumos</h3>
            <p class="text-muted small mb-0">Ingrese sus credenciales para acceder al sistema</p>
            <hr class="w-25 mx-auto mt-2">
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} py-2 text-center small" role="alert">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary small">Usuario</label>
                <input type="text" class="form-control" name="usuario" placeholder="Ingrese su usuario" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary small">Contraseña</label>
                <input type="password" class="form-control" name="contrasenia" placeholder="Ingrese su contraseña"
                    required>
            </div>

            <div class="d-flex justify-content-between gap-2">
                <button type="submit" class="btn text-white fw-semibold px-3 flex-fill"
                    style="background-color: #191970;">Ingresar</button>
                <a href="/registro"
                    class="btn text-white fw-semibold px-3 flex-fill text-decoration-none d-flex align-items-center justify-content-center"
                    style="background-color: #0d6efd;">Registrarse</a>
                <a href="/" class="btn btn-outline-secondary fw-semibold px-3"
                    onclick="alert('Cerrando aplicación');">Salir</a>
            </div>
        </form>
    </div>
</body>

</html>
