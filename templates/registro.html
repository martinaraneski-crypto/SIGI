<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>SIGI Web - Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-custom {
            background-color: #ffffff;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
            padding: 2rem;
        }

        .btn-custom-primary {
            background-color: #198754;
            color: white;
            font-weight: 600;
        }

        .btn-custom-primary:hover {
            background-color: #157347;
            color: white;
        }
    </style>
</head>

<body>

    <div class="card-custom">
        <h3 class="fw-bold text-dark mb-2 text-center"><i class="fa-solid fa-user-plus me-2 text-success"></i>Registro -
            SIGI</h3>
        <p class="text-muted text-center mb-4">Creación de cuenta para el sistema</p>
        <hr class="mb-4">

        
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('registro') }}" method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Nombre Completo:</label>
                <input type="text" class="form-control" name="nombre_completo" placeholder="Ej: Juan Pérez" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Nombre de Usuario:</label>
                <input type="text" class="form-control" name="usuario" placeholder="Ej: jperez" required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Contraseña:</label>
                <input type="password" class="form-control" name="contrasenia" placeholder="••••••••" required>
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-custom-primary py-2"><i class="fa-solid fa-check me-1"></i>
                    Registrarse</button>
                <a href="{{ url_for('login') }}" class="btn btn-outline-secondary py-2"><i
                        class="fa-solid fa-arrow-left me-1"></i> Volver al Login</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
