<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>SIGI Web - Selección de Sección</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar-custom {
            background-color: #0d6efd;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card-section {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            border-radius: 12px;
            overflow: hidden;
            background: #ffffff;
        }

        .card-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
        }

        
        .card-img-top {
            height: 140px;
            object-fit: contain;
            background-color: #fff;
            padding: 10px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-4">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
            <img src="{{ url_for('static', filename='css/sigi_logo.jpg') }}" alt="Logo" width="35" height="35"
                class="rounded me-2 shadow-sm" style="object-fit: cover;">
            SIGI Web
        </a>
        <div class="ms-auto text-white">
            <span class="me-3"><i class="fa-solid fa-user-circle me-1"></i> {{ session.get('nombre_completo') }}
                (<strong>{{ session.get('rol') }}</strong>)</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row text-center mb-4">
            <div class="col">
                <h1 class="fw-bold text-dark fs-2">Selección de Sección</h1>
                <p class="text-muted small">Elija el área de laboratorio en la que desea operar</p>
                <hr class="w-25 mx-auto my-2">
            </div>
        </div>

        <div class="row justify-content-center g-4">

            
            <div class="col-md-5">
                <div class="card card-section shadow-sm h-100 text-center p-3">
                    <img src="{{ url_for('static', filename='css/hematologia.jpg') }}" class="card-img-top"
                        alt="Hematología">
                    <div class="card-body p-2 d-flex flex-column justify-content-center">
                        <a href="/fijar-seccion/Hematología" class="btn btn-dark w-100 py-2 fw-bold">Ingresar a
                            Hematología</a>
                    </div>
                </div>
            </div>

           
            <div class="col-md-5">
                <div class="card card-section shadow-sm h-100 text-center p-3">
                    <img src="{{ url_for('static', filename='css/hemostasia.jpg') }}" class="card-img-top"
                        alt="Hemostasia">
                    <div class="card-body p-2 d-flex flex-column justify-content-center">
                        <a href="/fijar-seccion/Hemostasia" class="btn btn-primary w-100 py-2 fw-bold">Ingresar a
                            Hemostasia</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
